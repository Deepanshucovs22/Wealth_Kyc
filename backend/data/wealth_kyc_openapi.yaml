openapi: 3.0.3
info:
  title: Wealth Platform – Account Opening & KYC API (Mock)
  version: 1.0.0
  description: 'Mock API specification for client onboarding and KYC on an Indian wealth management / PMS / AIF platform.
    Built for demo and prototyping with synthetic data; not an official vendor API. Regulatory references: SEBI KRA regulations,
    CKYC (CERSAI), PMLA 2002 & rules, FATCA/CRS, SEBI PMS & AIF regulations.'
servers:
- url: https://sandbox.api.example.com
  description: Sandbox (mock)
security:
- bearerAuth: []
tags:
- name: Auth
- name: Onboarding Applications
- name: KYC Registry
- name: Verification
- name: Documents
- name: Profile & Declarations
- name: AML Screening
- name: Agreement & eSign
- name: Accounts
paths:
  /oauth2/token:
    post:
      tags:
      - Auth
      summary: Get access token
      description: OAuth 2.0 client-credentials grant for partner/system integrations; RM/ops users use OIDC SSO. Tokens are
        scoped (onboarding:write, kyc:read, screening:write, accounts:write) and expire in 3600s.
      operationId: get_access_token
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                  expires_in:
                    type: integer
                  scope:
                    type: string
              example:
                access_token: eyJhbGciOiJSUzI1NiIs...
                token_type: Bearer
                expires_in: 3600
                scope: onboarding:write kyc:read
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                client_id:
                  type: string
                client_secret:
                  type: string
                scope:
                  type: string
            example:
              grant_type: client_credentials
              client_id: partner_demo_01
              client_secret: ••••••
              scope: onboarding:write kyc:read
      security: []
  /v1/onboarding/applications:
    post:
      tags:
      - Onboarding Applications
      summary: Create onboarding application
      description: Starts a new account-opening application for a prospect. Returns an application_id and the checklist of
        required steps/documents derived from client_type, residential status and selected product. Idempotent with the Idempotency-Key
        header.
      operationId: create_onboarding_application
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  application_id:
                    type: string
                  client_id:
                    type: string
                  status:
                    type: string
                  required_steps:
                    type: array
                    items:
                      type: string
                  required_documents:
                    type: array
                    items:
                      type: string
                  created_at:
                    type: string
              example:
                application_id: APP2600004
                client_id: CL000004
                status: Draft
                required_steps:
                - KYC_FETCH
                - PERSONAL_DETAILS
                - FATCA_CRS
                - BANK
                - DEMAT
                - NOMINEE
                - RISK_PROFILE
                - DOCUMENTS
                - IPV
                - SCREENING
                - AGREEMENT_ESIGN
                required_documents:
                - PAN Card
                - Proof of Address
                - Photograph
                - Signature Specimen
                - Cancelled Cheque / Bank Statement
                - Income Proof
                - FATCA/CRS Self-Certification
                - Client Agreement
                created_at: 2026-09-04T16:28
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                client_type:
                  type: string
                pan:
                  type: string
                name:
                  type: string
                date_of_birth:
                  type: string
                mobile:
                  type: string
                email:
                  type: string
                product_code:
                  type: string
                strategy:
                  type: string
                rm_id:
                  type: string
                channel:
                  type: string
            example:
              client_type: Individual - Resident
              pan: PSNPS8976O
              name: Kiran Sheikh
              date_of_birth: '1964-04-12'
              mobile: +91 8679984033
              email: kiran.sheikh43@example.com
              product_code: PMS-NDISC
              strategy: Custom Equity
              rm_id: RM004
              channel: Family Office Referral
    get:
      tags:
      - Onboarding Applications
      summary: List / search applications
      description: Paginated work-queue view for RMs and Ops. Filter by stage, rm_id, client_type, aml_risk_rating, created
        date range. Supports cursor pagination.
      operationId: list_search_applications
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        application_id:
                          type: string
                        client_id:
                          type: string
                        name:
                          type: string
                        stage:
                          type: string
                        rm_name:
                          type: string
                        aml_risk_rating:
                          type: string
                        last_updated_at:
                          type: string
                  next_cursor:
                    type: string
                  total:
                    type: integer
              example:
                data:
                - application_id: APP2600004
                  client_id: CL000004
                  name: Kiran Sheikh
                  stage: Account Activated
                  rm_name: Rakesh Iyer
                  aml_risk_rating: Low
                  last_updated_at: 2026-09-17T16:28
                next_cursor: eyJvZmZzZXQiOjUwfQ==
                total: 240
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
      parameters:
      - name: stage
        in: query
        required: false
        schema:
          type: string
      - name: rm_id
        in: query
        required: false
        schema:
          type: string
      - name: client_type
        in: query
        required: false
        schema:
          type: string
      - name: aml_risk_rating
        in: query
        required: false
        schema:
          type: string
      - name: from
        in: query
        required: false
        schema:
          type: string
      - name: to
        in: query
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: string
  /v1/onboarding/applications/{application_id}:
    get:
      tags:
      - Onboarding Applications
      summary: Get application
      description: 'Full application aggregate: client profile, step completion, documents, screening outcome, open exceptions
        and audit trail pointer.'
      operationId: get_application
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  application_id:
                    type: string
                  client:
                    type: object
                    properties:
                      client_id:
                        type: string
                      name:
                        type: string
                      client_type:
                        type: string
                      pan:
                        type: string
                      kra_status:
                        type: string
                      ckyc_number:
                        type: string
                      residential_status:
                        type: string
                      risk_category:
                        type: string
                      aml_risk_rating:
                        type: string
                  stage:
                    type: string
                  steps_completed:
                    type: integer
                  steps_total:
                    type: integer
                  open_exceptions:
                    type: array
                    items: {}
              example:
                application_id: APP2600004
                client:
                  client_id: CL000004
                  name: Kiran Sheikh
                  client_type: Individual - Resident
                  pan: PSNPS8976O
                  kra_status: KYC Validated
                  ckyc_number: '42999460928241'
                  residential_status: Resident Individual
                  risk_category: Conservative
                  aml_risk_rating: Low
                stage: Account Activated
                steps_completed: 11
                steps_total: 11
                open_exceptions: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
      parameters:
      - name: application_id
        in: path
        required: true
        schema:
          type: string
    patch:
      tags:
      - Onboarding Applications
      summary: Update application sections
      description: Partial update of personal, address, contact, occupation/income or product sections (JSON Merge Patch).
        Each section is re-validated; fields pre-filled from KRA/CKYC are locked unless override_reason is supplied.
      operationId: update_application_sections
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  application_id:
                    type: string
                  updated_sections:
                    type: array
                    items:
                      type: string
                  validation_errors:
                    type: array
                    items: {}
              example:
                application_id: APP2600004
                updated_sections:
                - address
                - occupation
                validation_errors: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
      parameters:
      - name: application_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                address:
                  type: object
                  properties:
                    line1:
                      type: string
                    line2:
                      type: string
                    city:
                      type: string
                    state:
                      type: string
                    pincode:
                      type: string
                    country:
                      type: string
                occupation:
                  type: string
                annual_income_band:
                  type: string
                source_of_wealth:
                  type: string
            example:
              address:
                line1: 711, Lake Side Towers
                line2: Linking Road
                city: Bengaluru
                state: Karnataka
                pincode: '560054'
                country: India
              occupation: Business Owner
              annual_income_band: 5-10 Cr
              source_of_wealth: Business Income
  /v1/onboarding/applications/{application_id}/submit:
    post:
      tags:
      - Onboarding Applications
      summary: Submit for compliance review
      description: Locks the application and moves it to Compliance Review once all mandatory steps pass. Returns blocking
        checks if anything is missing.
      operationId: submit_for_compliance_review
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  application_id:
                    type: string
                  stage:
                    type: string
                  blocking_checks:
                    type: array
                    items: {}
                  sla_due_at:
                    type: string
              example:
                application_id: APP2600004
                stage: Compliance Review
                blocking_checks: []
                sla_due_at: 2026-09-12T18:00
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
      parameters:
      - name: application_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                submitted_by:
                  type: string
                declaration_accepted:
                  type: boolean
            example:
              submitted_by: RM004
              declaration_accepted: true
  /v1/onboarding/applications/{application_id}/decision:
    post:
      tags:
      - Onboarding Applications
      summary: Compliance decision
      description: 'Maker-checker action by Compliance: APPROVE, REJECT, HOLD or SEND_BACK with reason codes. APPROVE triggers
        agreement generation and eSign.'
      operationId: compliance_decision
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  application_id:
                    type: string
                  stage:
                    type: string
                  decision_id:
                    type: string
              example:
                application_id: APP2600004
                stage: eSign Pending
                decision_id: DEC-2026-004512
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
      parameters:
      - name: application_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                decision:
                  type: string
                reason_code:
                  nullable: true
                remarks:
                  type: string
                checker_id:
                  type: string
            example:
              decision: APPROVE
              reason_code: null
              remarks: CDD complete, low risk
              checker_id: CMP-ASHA
  /v1/onboarding/applications/{application_id}/timeline:
    get:
      tags:
      - Onboarding Applications
      summary: Application audit timeline
      description: Immutable, time-ordered stage transitions and user actions for audit (SEBI record-keeping).
      operationId: application_audit_timeline
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        stage:
                          type: string
                        action:
                          type: string
                        actor:
                          type: string
                        timestamp:
                          type: string
              example:
                events:
                - stage: Draft
                  action: Entered stage
                  actor: Rakesh Iyer
                  timestamp: 2026-09-04T16:28
                - stage: KYC Fetch
                  action: Entered stage
                  actor: System
                  timestamp: 2026-09-05T04:28
                - stage: Documents Pending
                  action: Entered stage
                  actor: Rakesh Iyer
                  timestamp: 2026-09-06T01:28
                - stage: IPV Pending
                  action: Entered stage
                  actor: System
                  timestamp: 2026-09-06T09:28
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
      parameters:
      - name: application_id
        in: path
        required: true
        schema:
          type: string
  /v1/kyc/kra/{pan}:
    get:
      tags:
      - KYC Registry
      summary: KRA status & fetch
      description: 'Queries the KYC Registration Agency (CVL/NDML/CAMS/KFin/DOTEX) for PAN status; when Registered/Validated,
        returns KYC data for pre-fill. Fresh KYC is triggered when status is Not Found.


        Downstream: KRA Gateway'
      operationId: kra_status_and_fetch
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  pan:
                    type: string
                  kra:
                    type: string
                  kra_status:
                    type: string
                  name:
                    type: string
                  dob:
                    type: string
                  address:
                    type: object
                    properties:
                      city:
                        type: string
                      pincode:
                        type: string
                  last_modified:
                    type: string
              example:
                pan: PSNPS8976O
                kra: CAMS KRA
                kra_status: KYC Validated
                name: Kiran Sheikh
                dob: '1964-04-12'
                address:
                  city: Bengaluru
                  pincode: '560054'
                last_modified: '2024-03-11'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
      parameters:
      - name: pan
        in: path
        required: true
        schema:
          type: string
  /v1/kyc/kra/upload:
    post:
      tags:
      - KYC Registry
      summary: Upload / modify KYC to KRA
      description: 'Pushes fresh or modified KYC record (with IPV and documents) to the KRA after verification. Async; status
        via webhook kyc.kra_status_changed.


        Downstream: KRA Gateway'
      operationId: upload_modify_kyc_to_kra
      responses:
        '202':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  submission_id:
                    type: string
                  status:
                    type: string
              example:
                submission_id: KRAUP-990214
                status: Submitted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                application_id:
                  type: string
                pan:
                  type: string
                action:
                  type: string
                ipv_ref:
                  type: string
            example:
              application_id: APP2600004
              pan: PSNPS8976O
              action: MODIFY
              ipv_ref: IPV-77812
  /v1/kyc/ckyc/search:
    get:
      tags:
      - KYC Registry
      summary: CKYC search
      description: 'Searches CERSAI Central KYC Registry by PAN/ID to retrieve CKYC number (KIN).


        Downstream: CKYC (CERSAI)'
      operationId: ckyc_search
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  pan:
                    type: string
                  ckyc_number:
                    type: string
                  found:
                    type: boolean
              example:
                pan: PSNPS8976O
                ckyc_number: '42999460928241'
                found: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
      parameters:
      - name: id_type
        in: query
        required: false
        schema:
          type: string
      - name: id_value
        in: query
        required: false
        schema:
          type: string
  /v1/kyc/ckyc/download:
    post:
      tags:
      - KYC Registry
      summary: CKYC download
      description: 'Downloads the CKYC record (photo, identity and address details) using KIN plus DOB for pre-fill and verification.


        Downstream: CKYC (CERSAI)'
      operationId: ckyc_download
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  ckyc_number:
                    type: string
                  name:
                    type: string
                  photo_ref:
                    type: string
                  address_proof_type:
                    type: string
              example:
                ckyc_number: '42999460928241'
                name: Kiran Sheikh
                photo_ref: blob://ckyc/photo/CL000004
                address_proof_type: Aadhaar (masked)
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ckyc_number:
                  type: string
                dob:
                  type: string
            example:
              ckyc_number: '42999460928241'
              dob: '1964-04-12'
  /v1/kyc/digilocker/consent:
    post:
      tags:
      - KYC Registry
      summary: DigiLocker consent link
      description: 'Creates a consent session for the client to share PAN and Aadhaar XML/address documents from DigiLocker.


        Downstream: DigiLocker'
      operationId: digilocker_consent_link
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  consent_id:
                    type: string
                  consent_url:
                    type: string
                  expires_in:
                    type: integer
              example:
                consent_id: DLC-55102
                consent_url: https://digilocker.example/consent/DLC-55102
                expires_in: 900
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                application_id:
                  type: string
                documents:
                  type: array
                  items:
                    type: string
                redirect_url:
                  type: string
            example:
              application_id: APP2600004
              documents:
              - PAN
              - AADHAAR
              redirect_url: https://app.example.com/onboarding/return
  /v1/verification/pan:
    post:
      tags:
      - Verification
      summary: Verify PAN
      description: 'Validates PAN with the ITD/Protean service: existence, name match, DOB match and Aadhaar-seeding status.


        Downstream: NSDL/Protean PAN'
      operationId: verify_pan
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  pan:
                    type: string
                  valid:
                    type: boolean
                  name_match:
                    type: boolean
                  dob_match:
                    type: boolean
                  aadhaar_seeded:
                    type: boolean
                  category:
                    type: string
              example:
                pan: PSNPS8976O
                valid: true
                name_match: true
                dob_match: true
                aadhaar_seeded: true
                category: Individual
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pan:
                  type: string
                name:
                  type: string
                dob:
                  type: string
            example:
              pan: PSNPS8976O
              name: Kiran Sheikh
              dob: '1964-04-12'
  /v1/verification/bank-account:
    post:
      tags:
      - Verification
      summary: Bank account verification (penny drop)
      description: 'Performs ₹1 IMPS penny-drop (or penny-less) verification and returns beneficiary name with fuzzy name-match
        score against KYC name.


        Downstream: Penny Drop'
      operationId: bank_account_verification_penny_drop
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  bank_link_id:
                    type: string
                  status:
                    type: string
                  beneficiary_name:
                    type: string
                  name_match_score:
                    type: integer
                  bank_name:
                    type: string
              example:
                bank_link_id: BK000006
                status: Verified
                beneficiary_name: KIRAN SHEIKH
                name_match_score: 95
                bank_name: Yes Bank
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                application_id:
                  type: string
                account_number:
                  type: string
                ifsc:
                  type: string
                account_type:
                  type: string
            example:
              application_id: APP2600004
              account_number: XXXXXXXX1186
              ifsc: YESB0054921
              account_type: Savings
  /v1/verification/ipv/sessions:
    post:
      tags:
      - Verification
