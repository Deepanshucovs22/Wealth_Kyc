      description: 'Consolidated KYC view: identifiers, KRA/CKYC status, risk & AML rating, document validity, screening history
        and next periodic review date.'
      operationId: client_kyc_360
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  client_id:
                    type: string
                  name:
                    type: string
                  pan:
                    type: string
                  kra_status:
                    type: string
                  ckyc_number:
                    type: string
                  risk_category:
                    type: string
                  aml_risk_rating:
                    type: string
                  due_diligence_level:
                    type: string
                  periodic_kyc_review_due:
                    type: string
              example:
                client_id: CL000004
                name: Kiran Sheikh
                pan: PSNPS8976O
                kra_status: KYC Validated
                ckyc_number: '42999460928241'
                risk_category: Conservative
                aml_risk_rating: Low
                due_diligence_level: CDD
                periodic_kyc_review_due: '2036-09-01'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
      parameters:
      - name: client_id
        in: path
        required: true
        schema:
          type: string
  /v1/kyc/reviews/due:
    get:
      tags:
      - Accounts
      summary: Periodic KYC reviews due
      description: Lists clients due for re-KYC based on risk-based review cycle (High 2y / Medium 8y / Low 10y) and expiring
        documents.
      operationId: periodic_kyc_reviews_due
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        client_id:
                          type: string
                        name:
                          type: string
                        review_due:
                          type: string
                        reason:
                          type: string
              example:
                data:
                - client_id: CL000004
                  name: Kiran Sheikh
                  review_due: '2036-09-01'
                  reason: Periodic
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
      parameters:
      - name: due_before
        in: query
        required: false
        schema:
          type: string
      - name: aml_risk_rating
        in: query
        required: false
        schema:
          type: string
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        format: uuid
  schemas:
    Error:
      type: object
      properties:
        error_code:
          type: string
        message:
          type: string
        field_errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              issue:
                type: string
        request_id:
          type: string
  responses:
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error_code: BAD_REQUEST
            message: Malformed request
            request_id: req_8f2a91c0d1
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error_code: UNAUTHORIZED
            message: Missing or invalid token
            request_id: req_8f2a91c0d1
    Unprocessable:
      description: Business validation failed (e.g. PAN-name mismatch, nominee shares ≠ 100)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error_code: VALIDATION_FAILED
            message: Business validation failed (e.g. PAN-name mismatch, nominee shares ≠ 100)
            request_id: req_8f2a91c0d1
